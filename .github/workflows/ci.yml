name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-tests:
    name: Root tests (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - 9.1.0
          - 9.2.0
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-root-${{ matrix.bazel }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - patches/llvm_kbuild_actions.patch
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Test
        env:
          BAZEL_BEP: ${{ runner.temp }}/root-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/root-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/root-${{ matrix.bazel }}.profile.gz
        run: |
          set -euo pipefail
          bazel --host_jvm_args=-Xmx6g \
            --bazelrc="${GITHUB_WORKSPACE}/.github/workflows/ci.bazelrc" \
            test //... \
            --noannounce_rc \
            --config=path-mapping \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/root-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/root-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/root-${{ matrix.bazel }}.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "Root tests (Bazel ${{ matrix.bazel }})" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-root-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/root-${{ matrix.bazel }}.profile.gz
            ${{ runner.temp }}/root-${{ matrix.bazel }}.bep.json
            ${{ runner.temp }}/root-${{ matrix.bazel }}.log
          if-no-files-found: warn
          retention-days: 14

  examples:
    name: Standalone examples (${{ matrix.suite.title }}, ${{ matrix.compiler }}, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - 9.1.0
          - 9.2.0
        compiler:
          - clang
          - gcc
        suite:
          - batch: initramfs
            title: initramfs
            targets: "//:example_initramfs"
          - batch: x86-64-variants
            title: x86_64 base + overlays
            targets: "//:x86_64_kernel //:x86_64_debug_kernel //:x86_64_btf_vmlinux //:x86_64_lz4_kernel"
          - batch: aarch64-base
            title: aarch64 base
            targets: "//:aarch64_kernel"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}
          module-root: examples
          repository-cache: |
            - examples/.bazelversion
            - examples/.bazelrc
            - examples/MODULE.bazel
            - examples/MODULE.bazel.lock
            - examples/gcc_toolchain_remote_execution.patch
            - examples/libbpf_old_uapi_compat.patch
            - examples/llvm_kbuild_actions.patch
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build ${{ matrix.suite.title }} with ${{ matrix.compiler }}
        working-directory: examples
        env:
          BAZEL_BEP: ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
          BAZEL_TARGETS: ${{ matrix.suite.targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<<"${BAZEL_TARGETS}"
          bazel --host_jvm_args=-Xmx6g \
            --bazelrc="${GITHUB_WORKSPACE}/.github/workflows/ci.bazelrc" \
            build "${targets[@]}" \
            --noannounce_rc \
            --config=path-mapping \
            --config="compiler-${{ matrix.compiler }}" \
            --notrack_incremental_state \
            --nokeep_state_after_build \
            --discard_analysis_cache \
            --experimental_record_metrics_for_all_mnemonics \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "Standalone examples (${{ matrix.suite.title }}, ${{ matrix.compiler }}, Bazel ${{ matrix.bazel }})" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
            ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
            ${{ runner.temp }}/examples-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          if-no-files-found: warn
          retention-days: 14

  qemu-e2e:
    name: QEMU e2e (${{ matrix.suite.title }}, ${{ matrix.compiler }}, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - 9.1.0
          - 9.2.0
        compiler:
          - clang
          - gcc
        suite:
          - batch: tooling
            title: E2E tooling
            targets: "//:compiler_identity_test //boot:init_test //cmd/qemuboot:qemuboot_test"
          - batch: linux-6.12-x86_64
            title: Linux 6.12 x86_64
            targets: "//:linux_6_12_96_x86_64_boot_test //:linux_6_12_96_x86_64_module_test //:modversions_6_12_96_x86_64_build_test"
          - batch: linux-6.12-aarch64
            title: Linux 6.12 aarch64
            targets: "//:linux_6_12_96_aarch64_boot_test //:linux_6_12_96_aarch64_module_test"
          - batch: linux-6.18-x86_64
            title: Linux 6.18 x86_64
            targets: "//:kernel_outputs_x86_64_build_test //:linux_6_18_39_x86_64_boot_test //:linux_6_18_39_x86_64_module_test //:modversions_6_18_39_x86_64_build_test //:srcversions_6_18_39_x86_64_build_test"
          - batch: linux-6.18-kvm-verity
            title: Linux 6.18 KVM and dm-verity
            targets: "//:kvm_verity_kernel_build_test //:kvm_arm64_neon_kernel_build_test //:cnic_module_version_build_test"
          - batch: linux-6.18-aarch64
            title: Linux 6.18 aarch64
            targets: "//:kernel_outputs_aarch64_build_test //:linux_6_18_39_aarch64_boot_test //:linux_6_18_39_aarch64_module_test //:modversions_6_18_39_aarch64_build_test"
          - batch: linux-6.18-armv7
            title: Linux 6.18 ARMv7
            targets: "//:kernel_outputs_armv7_build_test //:linux_source_root_package_build_test //artifacts:armv7_test"
          - batch: linux-6.18-rust-x86_64
            title: Linux 6.18 Rust x86_64
            targets: "//:linux_6_18_39_rust_module_test"
          - batch: linux-6.18-rust-aarch64
            title: Linux 6.18 Rust aarch64
            targets: "//:linux_6_18_39_aarch64_rust_module_test"
          - batch: linux-6.12-rust-x86_64
            title: Linux 6.12 Rust x86_64
            targets: "//:linux_6_12_96_rust_module_test"
          - batch: linux-6.12-rust-aarch64
            title: Linux 6.12 Rust aarch64
            targets: "//:linux_6_12_96_aarch64_rust_module_test"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}
          module-root: e2e
          repository-cache: |
            - e2e/.bazelversion
            - e2e/.bazelrc
            - e2e/MODULE.bazel
            - e2e/MODULE.bazel.lock
            - e2e/patches/BUILD.bazel
            - e2e/patches/gcc_toolchain_remote_execution.patch
            - e2e/patches/libbpf_old_uapi_compat.patch
            - e2e/patches/llvm_kbuild_actions.patch
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Run ${{ matrix.suite.title }} with ${{ matrix.compiler }}
        working-directory: e2e
        env:
          BAZEL_BEP: ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
          BAZEL_TARGETS: ${{ matrix.suite.targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<<"${BAZEL_TARGETS}"
          bazel --host_jvm_args=-Xmx6g \
            --bazelrc="${GITHUB_WORKSPACE}/.github/workflows/ci.bazelrc" \
            test "${targets[@]}" \
            --noannounce_rc \
            --config=path-mapping \
            --config="compiler-${{ matrix.compiler }}" \
            --notrack_incremental_state \
            --nokeep_state_after_build \
            --discard_analysis_cache \
            --experimental_record_metrics_for_all_mnemonics \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "QEMU e2e (${{ matrix.suite.title }}, ${{ matrix.compiler }}, Bazel ${{ matrix.bazel }})" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
            ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
            ${{ runner.temp }}/qemu-e2e-${{ matrix.suite.batch }}-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          if-no-files-found: warn
          retention-days: 14

  aya-e2e:
    name: Aya eBPF VMs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-aya-e2e
          module-root: aya_e2e
          repository-cache: |
            - aya_e2e/.bazelversion
            - aya_e2e/.bazelrc
            - aya_e2e/MODULE.bazel
            - aya_e2e/MODULE.bazel.lock
            - aya_e2e/patches/BUILD.bazel
            - aya_e2e/patches/aya_linux_bzl_api.patch
            - aya_e2e/patches/aya_rust_kernel_module_e2e.patch
            - aya_e2e/patches/llvm_kbuild_actions.patch
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Run Aya integration VMs
        working-directory: aya_e2e
        env:
          BAZEL_BEP: ${{ runner.temp }}/aya-e2e.bep.json
          BAZEL_LOG: ${{ runner.temp }}/aya-e2e.log
          BAZEL_PROFILE: ${{ runner.temp }}/aya-e2e.profile.gz
        run: |
          set -euo pipefail
          bazel --host_jvm_args=-Xmx6g \
            --bazelrc="${GITHUB_WORKSPACE}/.github/workflows/ci.bazelrc" \
            test \
            '@aya//test/integration-test:vm_aarch64' \
            '@aya//test/integration-test:vm_x86_64' \
            --noannounce_rc \
            --notrack_incremental_state \
            --nokeep_state_after_build \
            --discard_analysis_cache \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/aya-e2e.bep.json
          BAZEL_LOG: ${{ runner.temp }}/aya-e2e.log
          BAZEL_PROFILE: ${{ runner.temp }}/aya-e2e.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "Aya eBPF VMs" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-aya-e2e
          path: |
            ${{ runner.temp }}/aya-e2e.profile.gz
            ${{ runner.temp }}/aya-e2e.bep.json
            ${{ runner.temp }}/aya-e2e.log
          if-no-files-found: warn
          retention-days: 14

  sonic-e2e:
    name: SONiC linux_ngbde module (${{ matrix.compiler }}, Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - 9.1.0
          - 9.2.0
        compiler:
          - clang
          - gcc
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}
          module-root: sonic_e2e
          repository-cache: |
            - sonic_e2e/.bazelversion
            - sonic_e2e/.bazelrc
            - sonic_e2e/BUILD.bazel
            - sonic_e2e/MODULE.bazel
            - sonic_e2e/MODULE.bazel.lock
            - sonic_e2e/arm64_module_test.go
            - sonic_e2e/gcc_toolchain_remote_execution.patch
            - sonic_e2e/libbpf_old_uapi_compat.patch
            - sonic_e2e/llvm_kbuild_actions.patch
            - sonic_e2e/module_test.go
            - sonic_e2e/sai_bcm_kconfig.patch
            - sonic_e2e/sonic.config
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build SONiC linux_ngbde module with ${{ matrix.compiler }}
        working-directory: sonic_e2e
        env:
          BAZEL_BEP: ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
        run: |
          set -euo pipefail
          bazel --host_jvm_args=-Xmx6g \
            --bazelrc="${GITHUB_WORKSPACE}/.github/workflows/ci.bazelrc" \
            test //:sonic_linux_ngbde_module_test //:sonic_arm64_module_exclusion_test \
            --noannounce_rc \
            --config=path-mapping \
            --config="compiler-${{ matrix.compiler }}" \
            --notrack_incremental_state \
            --nokeep_state_after_build \
            --discard_analysis_cache \
            --experimental_record_metrics_for_all_mnemonics \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "SONiC linux_ngbde module (${{ matrix.compiler }}, Bazel ${{ matrix.bazel }})" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.profile.gz
            ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.bep.json
            ${{ runner.temp }}/sonic-e2e-${{ matrix.compiler }}-${{ matrix.bazel }}.log
          if-no-files-found: warn
          retention-days: 14
