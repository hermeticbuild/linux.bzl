name: CI

on:
  pull_request:
  push:
    branches:
      - fionera/init
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-tests:
    name: Root tests (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel:
          - 8.7.0
          - 9.1.0
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-root-${{ matrix.bazel }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Test
        env:
          BAZEL_BEP: ${{ runner.temp }}/root-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/root-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/root-${{ matrix.bazel }}.profile.gz
        run: |
          set -o pipefail
          bazel --host_jvm_args=-Xmx3g test //... --jobs=2 \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/root-${{ matrix.bazel }}.bep.json
          BAZEL_LOG: ${{ runner.temp }}/root-${{ matrix.bazel }}.log
          BAZEL_PROFILE: ${{ runner.temp }}/root-${{ matrix.bazel }}.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "Root tests (Bazel ${{ matrix.bazel }})" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-root-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/root-${{ matrix.bazel }}.profile.gz
            ${{ runner.temp }}/root-${{ matrix.bazel }}.bep.json
            ${{ runner.temp }}/root-${{ matrix.bazel }}.log
          if-no-files-found: warn
          retention-days: 14

  examples:
    name: Standalone examples
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-examples
          module-root: examples
          repository-cache: |
            - examples/.bazelversion
            - examples/MODULE.bazel
            - examples/MODULE.bazel.lock
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build
        working-directory: examples
        env:
          BAZEL_BEP: ${{ runner.temp }}/examples.bep.json
          BAZEL_LOG: ${{ runner.temp }}/examples.log
          BAZEL_PROFILE: ${{ runner.temp }}/examples.profile.gz
        run: |
          set -o pipefail
          bazel --host_jvm_args=-Xmx3g build //... --jobs=2 \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/examples.bep.json
          BAZEL_LOG: ${{ runner.temp }}/examples.log
          BAZEL_PROFILE: ${{ runner.temp }}/examples.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "Standalone examples" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-examples
          path: |
            ${{ runner.temp }}/examples.profile.gz
            ${{ runner.temp }}/examples.bep.json
            ${{ runner.temp }}/examples.log
          if-no-files-found: warn
          retention-days: 14

  qemu-e2e:
    name: QEMU boot tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-qemu-e2e
          module-root: e2e
          repository-cache: |
            - e2e/.bazelversion
            - e2e/MODULE.bazel
            - e2e/MODULE.bazel.lock
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Boot all kernels under TCG
        working-directory: e2e
        env:
          BAZEL_BEP: ${{ runner.temp }}/qemu-e2e.bep.json
          BAZEL_LOG: ${{ runner.temp }}/qemu-e2e.log
          BAZEL_PROFILE: ${{ runner.temp }}/qemu-e2e.profile.gz
        run: |
          set -o pipefail
          bazel --host_jvm_args=-Xmx3g test //... --jobs=2 --nocache_test_results \
            --build_event_json_file="${BAZEL_BEP}" \
            --profile="${BAZEL_PROFILE}" \
            2>&1 | tee "${BAZEL_LOG}"

      - name: Report cache efficiency
        if: ${{ !cancelled() }}
        env:
          BAZEL_BEP: ${{ runner.temp }}/qemu-e2e.bep.json
          BAZEL_LOG: ${{ runner.temp }}/qemu-e2e.log
          BAZEL_PROFILE: ${{ runner.temp }}/qemu-e2e.profile.gz
        run: |
          .github/workflows/bazel_cache_report.sh \
            "QEMU boot tests" \
            "${BAZEL_PROFILE}" \
            "${BAZEL_BEP}" \
            "${BAZEL_LOG}"

      - name: Upload Bazel profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bazel-profile-qemu-e2e
          path: |
            ${{ runner.temp }}/qemu-e2e.profile.gz
            ${{ runner.temp }}/qemu-e2e.bep.json
            ${{ runner.temp }}/qemu-e2e.log
          if-no-files-found: warn
          retention-days: 14
